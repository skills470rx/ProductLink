<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductLink - รวมสินค้าคัดพิเศษเพื่อคุณ</title>
  <link rel="stylesheet" href="ads.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Hero Header -->
  <header class="hero">
    <div class="hero-content">
      <h1 class="hero-title">ProductLink</h1>
      <p class="hero-subtitle">รวมสินค้าคัดพิเศษเพื่อคุณ</p>
    </div>
    <div class="hero-wave"></div>
  </header>

  <!-- Search & Controls -->
  <div class="controls-bar">
    <div class="search-box">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="ค้นหาสินค้า เช่น กันแดด..." autocomplete="off">
      <button class="clear-search" id="clearSearch" style="display:none;">&times;</button>
    </div>
    <div class="sort-box">
      <label for="sortSelect">เรียงตาม:</label>
      <select id="sortSelect">
        <option value="latest">ล่าสุด</option>
        <option value="price-asc">ราคาต่ำ → สูง</option>
        <option value="price-desc">ราคาสูง → ต่ำ</option>
        <option value="clicks">ค่าคอมสูง</option>
        <option value="popular">ยอดนิยม</option>
      </select>
    </div>
  </div>

  <!-- Categories -->
  <nav class="categories">
    <button class="cat-btn active" data-cat="all">🏷️ ทั้งหมด</button>
    <button class="cat-btn" data-cat="beauty">💄 ความงาม</button>
    <button class="cat-btn" data-cat="fashion">👕 แฟชั่น</button>
    <button class="cat-btn" data-cat="tech">📱 ไอที</button>
    <button class="cat-btn" data-cat="home">🏠 ของใช้</button>
    <button class="cat-btn" data-cat="auto">🚗 ยานยนต์</button>
  </nav>

  <!-- Random Button -->
  <div class="random-section">
    <button class="random-btn" id="randomBtn">
      <span class="dice-icon">🎲</span> สุ่มสินค้า
    </button>
  </div>

  <!-- Results Count -->
  <div class="results-info" id="resultsInfo"></div>

  <!-- Products Grid -->
  <main id="ads"></main>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-image-wrap">
        <img id="modalImage" src="" alt="">
        <div class="modal-tags" id="modalTags"></div>
      </div>
      <div class="modal-body">
        <h2 id="modalTitle"></h2>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-highlights" id="modalHighlights"></div>
        <div class="modal-reason" id="modalReason"></div>
        <div class="modal-meta">
          <span class="modal-clicks" id="modalClicks"></span>
          <span class="modal-cat" id="modalCat"></span>
        </div>
        <a class="modal-go-btn" id="modalGoBtn" href="#" target="_blank" rel="noopener">
          <span>ไป Shopee</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>ProductLink &copy; 2026 — รวมสินค้าคัดพิเศษเพื่อคุณ</p>
  </footer>

<script src="ads.js"></script>
</body>
</html>
